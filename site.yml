---
- name: Durcissement et supervision
  hosts: servers
  become: true
  vars:
    ssh_settings:
      - option: MaxAuthTries
        valeur: "{{ ssh_max_tries }}"
      - option: LoginGraceTime
        valeur: "{{ ssh_login_grace }}"
      - option: ClientAliveInterval
        valeur: "{{ ssh_alive_interval }}"
  tasks:
    - name: Déployer le message MOTD personnalisé
      ansible.builtin.template:
        src: templates/motd.j2
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
      tags:
        - motd

    - name: Ajouter les hôtes gérés dans /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS"
        block: "{{ lookup('template', 'templates/hosts_block.j2') }}"
      tags:
        - motd

    - name: Sauvegarder la configuration SSH sans écraser une sauvegarde existante
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.bak
        remote_src: true
        force: false
      tags:
        - ssh

    - name: Appliquer les paramètres de sécurité SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[#\\s]*{{ item.option }}\\s+'
        line: '{{ item.option }} {{ item.valeur }}'
        validate: '/usr/sbin/sshd -t -f %s'
      loop: "{{ ssh_settings }}"
      notify: Redémarrer SSH
      tags:
        - ssh

    - name: Créer le répertoire de journaux
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags:
        - logs

    - name: Déployer la configuration logrotate
      ansible.builtin.template:
        src: templates/logrotate.j2
        dest: /etc/logrotate.d/tpapp
        owner: root
        group: root
        mode: '0644'
      tags:
        - logs

    - name: Installer chrony
      ansible.builtin.package:
        name: chrony
        state: present
      tags:
        - time

    - name: Démarrer et activer le service chrony
      ansible.builtin.service:
        name: "{{ time_service[ansible_os_family] }}"
        state: started
        enabled: true
      tags:
        - time

  handlers:
    - name: Redémarrer SSH
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
        state: restarted
